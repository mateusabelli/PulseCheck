name: PulseCheck CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5.1.0
      with:
        dotnet-version: 10.0.x

    - name: Restore Dependencies
      run: dotnet restore PulseCheck.slnx

    - name: Build Solution
      run: dotnet build PulseCheck.slnx --no-restore

    - name: Run Tests
      run: dotnet test PulseCheck.slnx --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Test Reporter
      uses: dorny/test-reporter@v2.5.0
      with:
        name: .NET Test Results
        path: "**/test-results.trx"
        reporter: dotnet-trx